    <style>
      @media (prefers-reduced-motion: no-preference) {
        .thinker-halo {
          animation: thinker-halo-pulse 5s ease-in-out infinite;
          transform-origin: 210px 210px;
        }
        .thinker-shadow {
          animation: thinker-shadow-breathe 5s ease-in-out infinite;
          transform-origin: 208px 433px;
        }
        .thinker-pose {
          animation: thinker-contemplate 7s ease-in-out infinite;
          transform-origin: 210px 355px;
        }
        @keyframes thinker-halo-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.92; transform: scale(1.03); }
        }
        @keyframes thinker-shadow-breathe {
          0%, 100% { transform: scaleX(1); opacity: 0.45; }
          50% { transform: scaleX(1.08); opacity: 0.38; }
        }
        @keyframes thinker-contemplate {
          0%, 100% { transform: rotate(0deg) translateY(0); }
          35% { transform: rotate(-1.8deg) translateY(-2px); }
          70% { transform: rotate(1.2deg) translateY(-1px); }
